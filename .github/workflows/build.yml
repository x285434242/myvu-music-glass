name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships with Android SDK (incl. platform 34) preinstalled.
      # Do NOT use android-actions/setup-android@v3: it calls the removed
      # `sdkmanager tools` package and fails. sdkmanager is NOT on PATH, so
      # locate it under $ANDROID_HOME and treat install as best-effort.
      - name: Ensure Android platform + build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests (LRC + search parsing)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-glass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
